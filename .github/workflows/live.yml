name: Live

# This job's three steps, in order (order is not arbitrary):
#   1. scores    pull finals from ESPN into the game documents
#   2. snapshots recompute pools/{p}/snapshots/* from those scores — NOT
#                read by the app (index.html queries picks/ directly; see
#                build_snapshot.py's own header for the full story)
#   3. reminders read the progress document step 2 writes — but only
#                scripts/remind.py does; worker/live.js's own reminder
#                cron computes "missing" itself and ignores this entirely

# SCHEDULE DISABLED — worker/live.js replaced this.
#
# That Worker runs scores every minute and reminders every five, on the
# minute, which is the whole reason it was written (see its header: GitHub
# cron fires up to 15-20 minutes late, which is fine for scores and useless
# for a "last call, 30 minutes out" alert).
#
# It was never turned off here, so BOTH pipelines were sending reminders on
# the same five-minute cadence with separate dedupe stores — the Worker
# marks sent reminders in Cloudflare KV, remind.py marks them in Firestore,
# and neither can see the other. Every player would have received every
# kickoff reminder TWICE, all season.
#
# Left runnable by hand (workflow_dispatch) because build_snapshot.py and
# remind.py are still useful as a manual fallback if the Worker is down.
on:
  # schedule:
  #   - cron: '*/5 * * * 4,5,0,1'
  #   - cron: '17 * * * 2,3,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build snapshots, send no notifications'
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would double-write snapshots and race the
  # reminder markers. Let the running one finish.
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install firebase-admin requests

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SA" > /tmp/sa.json

      # Scores FIRST. build_snapshot.py reads game documents, so if this
      # step were skipped the Grid would rebuild from stale results and
      # nothing would turn green until the Sunday-night scoring run.
      - name: Refresh scores
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
        run: python scripts/score_week.py --season ${{ vars.SEASON || '2026' }} --scores-only

      - name: Build snapshots
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
        run: python scripts/build_snapshot.py --season ${{ vars.SEASON || '2026' }}

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
        run: |
          ARGS="--season ${{ vars.SEASON || '2026' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python scripts/remind.py $ARGS

      - name: Shred the key
        if: always()
        run: rm -f /tmp/sa.json
