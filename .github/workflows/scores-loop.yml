name: Live scores (window)

# ONE RUN THAT COVERS A WHOLE GAME WINDOW, instead of a cron every five
# minutes that GitHub will not honour.
#
# WHY THIS FILE EXISTS, so nobody "simplifies" it back into scores.yml.
#
# scores.yml asked for `*/5` inside each game window. It was never once
# fired by the scheduler: it sat on main for eleven hours before its
# first window opened, then skipped roughly sixteen consecutive ticks
# inside that open window — "0 workflow runs" on the Actions page, with
# a manual dispatch of the identical job going green in 23 seconds.
# Season, week, secret and ESPN access were all verified fine.
#
# Meanwhile score-week.yml's schedule fires reliably, and its crons are
# single-fire (`0 1 * * 1`). That is the difference this file is built
# on: ask for ONE run per window, which is the shape that works, and put
# the repetition INSIDE the job where no scheduler can drop it.
#
# It also makes the scheduler's lateness stop mattering. A `*/5` tick
# that arrives twenty minutes late has already missed its moment; a
# window start that arrives twenty minutes late still covers the
# remaining five and a half hours.
#
# WHAT IT DOES NOT DO: every pull is `--scores-only`, which returns
# before score_pools() and notify(), so the loop itself writes game
# documents only — status, winner, awayScore, homeScore. No standings
# rows, no push notifications, no weekly awards.
#
# THE ONE EXCEPTION, ADDED DELIBERATELY: the week closer at the bottom of
# the loop. When the status file says every game in the week is final,
# this runs the full scorer ONCE for that week and then stops touching
# it. Why it is worth the exception:
#
#   Monday Night Football goes final around 23:30 ET. The next scheduled
#   scoring run is the Tuesday cron. So for about four hours the app
#   showed a finished week with no winner, no seals and no result
#   notification, on the one night the whole pool is watching — and this
#   job was awake, connected to Firestore and holding the very fact
#   needed to fix it. Seals now land in about five minutes.
#
# What keeps the exception safe, and all four matter:
#   - it is gated on `complete`, which is `games > 0 and final == games`
#     — the same test score_week.py's own weekly awards use, so the loop
#     cannot conclude a week is over on a rule the scorer disagrees with;
#   - postponed and cancelled games are never written final in the first
#     place (see pull_scores), so an abandoned game keeps its week open
#     rather than closing it early;
#   - it runs at most ONCE per week per window, tracked in $CLOSED;
#   - and it is the same script on the same data as the cron, which
#     recomputes a week from scratch, so the Tuesday run is still a
#     correct re-score and not a double-count. The status file's
#     `complete` is the only new decision in the whole arrangement.
#
# It is also allowed to fail without failing the window: if the closer
# errors, scores were still pulled and the Tuesday cron still scores the
# week — which is exactly where this started.
#
# AND THE SCORES ON THE CARDS DO NOT DEPEND ON IT. Since v1.31.0 each
# phone reads the ESPN scoreboard itself once a minute while a game it
# is showing is running (see pullEspn in index.html). What this job is
# actually for is `status: 'final'` and `winner`, which only the server
# may write — they are what flip a card to Final, colour the Grid and
# move the weekly standings.

on:
  # SINGLE FIRE PER WINDOW. Six hours is the GitHub job ceiling, so each
  # of these starts a run that covers itself and then ends.
  #
  # Times are UTC. From the first Sunday in November the US goes to EST
  # and every window slides an hour later in UTC — these all start an
  # hour early and run long for exactly that reason, the same warning
  # that is in score-week.yml.
  # WINDOWS OVERLAP ON PURPOSE. A run lasts 350 minutes, so back-to-back
  # starts six hours apart leave a gap every time GitHub is a few minutes
  # late — and it usually is. Starting every five hours means the next
  # window is already running before the last one closes, and a late
  # start costs nothing.
  #
  # Overlapping runs are harmless: pull_scores() writes a game document
  # only when its score or status actually changed, so the second run of
  # a pair writes nothing. The job is idempotent by construction.
  #
  # COVERAGE CHECKED AGAINST REAL KICKOFFS, in both EDT and EST, because
  # a window that ends while a game is still being played is the same
  # bug as no window at all:
  #   Sun 1pm ET   17:00 UTC, ends ~20:15   -> Sun 16:00
  #   Sun 4:25 ET  20:25 UTC, ends ~23:40   -> Sun 21:00
  #   SNF 8:20 ET  00:20 UTC Mon, ends ~03:40 -> Mon 02:00 (and EST's
  #                                              04:40 finish too)
  #   MNF 8:15 ET  00:15 UTC Tue, ends ~03:30 -> Mon 23:00
  #   TNF 8:15 ET  00:15 UTC Fri, ends ~03:30 -> Thu 23:00
  #   Sat late     00:15 UTC Sun (wks 16-18) -> Sat 23:00
  schedule:
    - cron: '0 16 * * 0'   # Sun 16:00 UTC -> the 1pm ET slate
    - cron: '0 21 * * 0'   # Sun 21:00 UTC -> the 4pm ET slate, to the whistle
    - cron: '0 2 * * 1'    # Mon 02:00 UTC -> Sunday Night Football, EDT or EST
    - cron: '0 23 * * 1'   # Mon 23:00 UTC -> Monday Night Football
    - cron: '0 23 * * 4'   # Thu 23:00 UTC -> Thursday Night Football
    - cron: '0 23 * * 5'   # Fri 23:00 UTC -> Black Friday / Friday night
    - cron: '0 16 * * 6'   # Sat 16:00 UTC -> Saturday afternoon, weeks 16-18
    - cron: '0 23 * * 6'   # Sat 23:00 UTC -> Saturday night, weeks 16-18
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep pulling (default 350, max 350)'
        required: false
      every:
        description: 'Seconds between pulls (default 300, min 60)'
        required: false
      week:
        description: 'Week to refresh (blank = auto-detect)'
        required: false
      no_close:
        description: 'Set to 1 to pull scores only and never close a finished week'
        required: false
      no_early_exit:
        description: 'Set to 1 to run the full window even with nothing live'
        required: false

# NO CONCURRENCY GROUP HERE, and that is a considered choice rather than
# an omission. Both options are wrong for a six-hour job:
#
#   cancel-in-progress: true  — the 21:00 window would CANCEL the 16:00
#     one mid-pull. It would work, but every Sunday would leave a trail
#     of "cancelled" runs on the Actions page, which is indistinguishable
#     from a failure at a glance and trains you to ignore that page.
#   cancel-in-progress: false — the 21:00 window would QUEUE behind the
#     16:00 one and start five hours late, having covered nothing.
#
# So: let them overlap. pull_scores() only writes a game whose score or
# status actually changed, so a concurrent second run writes nothing and
# costs nothing. This repo is public, and GitHub-hosted runners are free
# for public repositories, so the extra minutes are free too. It also
# means the manual one-shot in scores.yml can be clicked DURING a window
# without cancelling it.
jobs:
  loop:
    runs-on: ubuntu-latest
    # Must exceed the loop's own budget, or GitHub kills the job mid-pull
    # and the run goes red for no real reason. 350 + margin.
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # From requirements.txt, not by name. `cache: 'pip'` above globs for
      # that file and fails the whole job when it is missing — which is
      # exactly how "Score the week" died silently for days.
      - run: pip install -r requirements.txt

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # An unset secret is the empty string and `echo` still succeeds,
          # so this step would go green having written one newline, and
          # the failure would surface six frames deep inside
          # firebase_admin as a JSON parse error naming neither the
          # secret nor this file.
          if [ -z "${SA:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set on this repository."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          printf '%s' "$SA" > /tmp/sa.json
          python -c "import json,sys; json.load(open('/tmp/sa.json'))" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT is set but is not valid JSON."
            exit 1
          }

      - name: Pull scores every few minutes until the window closes
        # Inputs go through the environment, never straight into the
        # shell: a dispatch input of `1; cat /tmp/sa.json` would
        # otherwise print the Firebase admin key into a public run log.
        env:
          FIREBASE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
          SEASON: ${{ vars.SEASON || '2026' }}
          IN_WEEK: ${{ inputs.week }}
          IN_MINUTES: ${{ inputs.minutes }}
          IN_EVERY: ${{ inputs.every }}
          IN_NO_CLOSE: ${{ inputs.no_close }}
          IN_NO_EARLY_EXIT: ${{ inputs.no_early_exit }}
        run: |
          set -u

          # Every input is validated as digits-only and then clamped.
          # A blank input on a scheduled run takes the default.
          case "${IN_WEEK:-}" in
            ''|*[!0-9]*) WEEK_ARG="" ;;
            *)           WEEK_ARG="--week ${IN_WEEK}" ;;
          esac
          case "${IN_MINUTES:-}" in
            ''|*[!0-9]*) MINUTES=350 ;;
            *)           MINUTES="$IN_MINUTES" ;;
          esac
          case "${IN_EVERY:-}" in
            ''|*[!0-9]*) EVERY=300 ;;
            *)           EVERY="$IN_EVERY" ;;
          esac
          [ "$MINUTES" -gt 350 ] && MINUTES=350
          [ "$MINUTES" -lt 1 ]   && MINUTES=1
          [ "$EVERY" -lt 60 ]    && EVERY=60      # be a good citizen to ESPN
          [ "$EVERY" -gt 1800 ]  && EVERY=1800

          # Both switches are OFF by default and exist only so a window
          # can be run in its old shape from the Actions page when
          # something is being diagnosed. "1" and nothing else counts.
          case "${IN_NO_CLOSE:-}" in 1) CLOSE=0 ;; *) CLOSE=1 ;; esac
          case "${IN_NO_EARLY_EXIT:-}" in 1) EARLY=0 ;; *) EARLY=1 ;; esac

          STATUS=/tmp/week-status.json
          CLOSED=""                # weeks this run has already scored
          rm -f "$STATUS"

          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "Window: ${MINUTES} min, a pull every ${EVERY}s, season ${SEASON}."
          echo "Closes at $(date -u -d "@${END}" +%H:%M:%SZ 2>/dev/null || echo "${END}")."

          n=0
          fails=0
          while : ; do
            n=$(( n + 1 ))
            echo "::group::pull ${n} — $(date -u +%H:%M:%S)Z"
            # A FAILED PULL MUST NOT END THE WINDOW. One ESPN hiccup, one
            # transient Firestore error, and a `set -e` style script would
            # exit here and leave the remaining five hours uncovered —
            # which is the whole failure this job exists to prevent.
            rm -f "$STATUS"
            if python scripts/score_week.py --season "$SEASON" $WEEK_ARG \
                 --scores-only --status-file "$STATUS"; then
              :
            else
              fails=$(( fails + 1 ))
              echo "::warning::pull ${n} failed; continuing (${fails} so far)"
            fi
            echo "::endgroup::"

            # ---- read the status this pull wrote ------------------------
            # ABSENT OR UNREADABLE MEANS "CARRY ON AS BEFORE". A missing
            # status file must never close a week and must never end a
            # window early — the whole point of both features is to do
            # LESS waiting, and doing them on no information would be
            # doing more damage. So every field defaults to the value
            # that changes nothing: no week, not complete, one game live.
            ST_WEEK=""; ST_COMPLETE=0; ST_LIVE=1; ST_NEXT=""
            # scripts/status_env.py prints those four as shell
            # assignments and prints the safe defaults for anything it
            # cannot read. It is tested in scripts/test/test_status_env.py
            # — see its docstring for why it is a file rather than a
            # heredoc in here.
            eval "$(python scripts/status_env.py "$STATUS" || true)" || true

            # ---- close a finished week, once ---------------------------
            # See the header for why this exception to "never scores
            # anybody" exists and what keeps it safe. `case` on a padded
            # list so week 1 never matches week 11.
            if [ "$CLOSE" = "1" ] && [ "$ST_COMPLETE" = "1" ] && [ -n "$ST_WEEK" ]; then
              case " $CLOSED " in
                *" $ST_WEEK "*)
                  : ;;                              # already done this run
                *)
                  echo "::group::week ${ST_WEEK} is 16-of-16 final — scoring it now"
                  # NOT fatal. If this errors the window keeps pulling and
                  # the Tuesday cron still scores the week.
                  if python scripts/score_week.py --season "$SEASON" --week "$ST_WEEK"; then
                    echo "::notice::Week ${ST_WEEK} scored and notified from the live window."
                    CLOSED="$CLOSED $ST_WEEK"
                  else
                    echo "::warning::closing week ${ST_WEEK} failed; the Tuesday run will do it."
                    # Marked closed anyway: retrying a failing full score
                    # every EVERY seconds for five hours would send a
                    # burst of notifications the moment it started
                    # working, and re-push a results notification to
                    # fifty phones for each attempt that half-succeeded.
                    CLOSED="$CLOSED $ST_WEEK"
                  fi
                  echo "::endgroup::"
                  ;;
              esac
            fi

            REMAIN=$(( END - $(date +%s) ))

            # ---- stop when there is nothing left to watch --------------
            # A window is 350 minutes because a slate can be. When the
            # last whistle goes twenty minutes in, the remaining five
            # hours were seventy more ESPN requests about a week that
            # cannot change — and the cost of that is not money, it is
            # that a job which is always running tells you nothing when
            # you look at it.
            #
            # BOTH CONDITIONS ARE REQUIRED, and the second is the one
            # that stops this being a bug. Nothing live is NOT enough:
            # the Thursday window opens at 23:00 UTC for a 00:15 kickoff,
            # so for the first 75 minutes nothing is live and exiting
            # would mean nothing at all covered Thursday night football.
            # So: nothing live AND no kickoff anywhere in the season
            # before this window closes. next_kick_ms spans the season
            # precisely so the Thursday window can see next week's
            # opener.
            if [ "$EARLY" = "1" ] && [ "$ST_LIVE" = "0" ]; then
              NOTHING_COMING=1
              if [ -n "$ST_NEXT" ] && [ "$ST_NEXT" -lt "$END" ]; then
                NOTHING_COMING=0
              fi
              if [ "$NOTHING_COMING" = "1" ]; then
                echo "Nothing live and no kickoff before this window closes."
                echo "Stopping after ${n} pull(s), ${fails} failed."
                break
              fi
            fi

            if [ "$REMAIN" -le "$EVERY" ]; then
              echo "Window closed after ${n} pull(s), ${fails} failed."
              break
            fi
            sleep "$EVERY"
          done

          # Red only if NOTHING worked. A window that pulled 70 times and
          # missed twice did its job; going red on that trains everyone to
          # ignore the emails, which is how the last silent failure stayed
          # silent for nine days.
          if [ "$fails" -ge "$n" ]; then
            echo "::error::every pull in this window failed."
            exit 1
          fi

      - name: Shred the key
        if: always()
        run: rm -f /tmp/sa.json /tmp/week-status.json /tmp/week-status.json.part
